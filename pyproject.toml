[project]
name = "identity-verification-poc"
version = "0.5.0"
description = "Document consistency and face-verification research prototype"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.141,<1", "numpy>=1.26,<3", "pillow>=11,<13",
  "pydantic-settings>=2.15,<3", "pymupdf>=1.26,<3",
  "python-multipart>=0.0.32", "rapidfuzz>=3.13,<4", "uvicorn>=0.52,<1",
]
[project.scripts]
identity-verification = "identity_verification.api.main:run"
[project.optional-dependencies]
ocr-easy = ["easyocr>=1.7,<2", "opencv-python>=4.12,<5"]
ocr-tesseract = ["pytesseract>=0.3.13,<1"]
ocr-paddle = ["paddleocr>=3.7,<4", "paddlepaddle>=3.2,<4", "opencv-python>=4.12,<5"]
ocr-nanonets = ["accelerate>=1.10,<2", "torch>=2.6,<3", "transformers>=4.57,<6"]
face = ["ultralytics>=8.4,<9", "huggingface-hub>=1.0,<2", "insightface>=0.7",
        "onnxruntime>=1.23,<2", "opencv-python>=4.12,<5", "torch>=2.6,<3", "torchvision>=0.21,<1"]
face-demo = ["gradio>=6,<7", "scikit-learn>=1.7,<2", "matplotlib>=3.10,<4"]
dev = ["httpx>=0.28,<1", "pytest>=9,<10", "ruff>=0.17,<0.18", "opencv-python>=4.12,<5"]
[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
identity_verification = ["**/*.html", "**/*.js", "**/*.css"]
[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/identity_verification/features/face_verification/original"]
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
